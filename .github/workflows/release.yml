name: Release
# Pushing a tag like v0.2.0 on a commit in main builds a universal (Apple
# silicon + Intel) macOS app, signs it with the Developer ID certificate,
# notarizes and staples the app and the .dmg, and publishes the .dmg as a
# GitHub Release. Linux builds .deb and .AppImage packages on the same tag and
# publishes them to the same release; the two jobs run in parallel. Secrets
# and steps: docs/tooling.md › Releasing; scripts/set-release-secrets.sh sets
# the macOS ones.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS (signed, notarized)
    runs-on: macos-latest
    # Apple's first notarization of a new app can take well over an hour.
    timeout-minutes: 180
    steps:
      # Third-party actions are pinned to commits: this job holds the signing
      # certificate. No saved credentials, so build code can't read the token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The bundle is named from tauri.conf.json's version; a mismatched tag
      # would publish "v0.2.0" holding Blogosphere_0.1.0.dmg. Only main ships.
      - name: Tag matches the app version and is on main
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that isn't on main."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Compiling runs every npm and Cargo build script, so it gets no secrets.
      - name: Build
        run: npm run tauri build -- --target universal-apple-darwin --no-bundle

      # The Tauri bundler imports APPLE_CERTIFICATE into a temporary keychain,
      # signs with the hardened runtime, then notarizes and staples the app.
      # It only signs the .dmg, so the .dmg is notarized and stapled here.
      - name: Bundle, sign and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Jesse Vincent (87WJ58S66M)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: 87WJ58S66M
        run: |
          npm run tauri bundle -- --target universal-apple-darwin --bundles app,dmg
          shopt -s failglob
          dmg=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "${dmg[0]}" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "${dmg[0]}"

      # Checks the file people download, and the app inside it, not just the
      # app in the build folder.
      - name: Verify signatures, Gatekeeper and staples
        run: |
          shopt -s failglob
          dmg=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          mount="$RUNNER_TEMP/blogosphere-dmg"
          hdiutil attach "${dmg[0]}" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Blogosphere.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      # Create-or-upload: the linux job may create the release first (the two
      # run in parallel), and a re-run replaces the .dmg instead of failing.
      # A failed create means the release already exists, so upload.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s failglob
          dmg=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if ! gh release create "$GITHUB_REF_NAME" "${dmg[0]}" --repo "$GITHUB_REPOSITORY" \
            --title "Blogosphere ${GITHUB_REF_NAME#v}" --generate-notes; then
            gh release upload "$GITHUB_REF_NAME" "${dmg[0]}" --clobber --repo "$GITHUB_REPOSITORY"
          fi

  linux:
    name: Linux (.deb, .AppImage)
    # The oldest Ubuntu the runners offer: the .deb's glibc dependency is
    # whatever this image has, and a newer one wouldn't install on older
    # distributions. Same reason CI's rust leg pins it.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      # Pinned to commits like the macOS job, and for the same reason: this
      # job holds a write-capable release token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag matches the app version and is on main
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that isn't on main."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - name: Install Linux webview and bundling prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Builds and bundles in one pass: nothing here is signed, so there are
      # no secrets to keep out of the build scripts' environment.
      - name: Build
        run: npm run tauri build -- --bundles deb,appimage

      # The .deb is the package that actually installs; check it as a package,
      # not just that a file appeared.
      - name: Verify the packages
        run: |
          shopt -s failglob
          deb=(src-tauri/target/release/bundle/deb/*.deb)
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          dpkg-deb --info "${deb[0]}"
          dpkg-deb --contents "${deb[0]}" | grep -q usr/bin/app
          test -x "${appimage[0]}"

      # Same create-or-upload rule as the macOS job, so either job may finish
      # first and a re-run doesn't fail on an existing release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s failglob
          deb=(src-tauri/target/release/bundle/deb/*.deb)
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if ! gh release create "$GITHUB_REF_NAME" "${deb[0]}" "${appimage[0]}" --repo "$GITHUB_REPOSITORY" \
            --title "Blogosphere ${GITHUB_REF_NAME#v}" --generate-notes; then
            gh release upload "$GITHUB_REF_NAME" "${deb[0]}" "${appimage[0]}" --clobber --repo "$GITHUB_REPOSITORY"
          fi
