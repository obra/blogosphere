[package]
name = "app"
version = "0.1.0"
description = "Blogosphere — a blogging client for blog.fsck.com"
authors = ["Jesse Vincent"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Enforced via `cargo check` / `cargo build` (plain rustc warnings) and via
# `cargo clippy -- -D warnings` (promotes the clippy::pedantic group, which
# defaults to "warn", to a hard failure). A tiny, documented per-lint
# allow-list lives as crate-level attributes in src/lib.rs.
[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = "warn"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-http = "2.5.9"
tauri-plugin-fs = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
# keyring's platform stores are opt-in features; on a target without its
# feature the crate silently uses an in-memory mock — the token "saves" but
# vanishes on relaunch. apple-native covers macOS+iOS; windows-native covers
# Windows; Android uses the file fallback in keychain.rs (no keyring backend
# exists there). keychain.rs has a test pinning "never the mock store".
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Dev-only agent access (screenshots, DOM, IPC) for the tauri-mcp CLI.
# Registered only in debug builds and bound to localhost — see lib.rs.
tauri-plugin-mcp-bridge = "0.13.0"
# Glass behind the macOS sidebar (src/glass.rs). A no-op on other platforms.
tauri-plugin-liquid-glass = "0.1.6"

# SF Symbol rendering (src/symbols.rs) and the glass settings observer
# (src/glass.rs). default-features = false: the crates'
# defaults switch on hundreds of AppKit features we don't use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry", "NSNotification", "NSOperation", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphics",
  "NSGraphicsContext",
  "NSFontDescriptor",
  "NSWorkspace",
  "NSAccessibility",
  "block2",
  "objc2-core-foundation",
] }

# tauri::test's mock runtime, for settings_window's tests.
[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }

# Runs on the main thread (AppKit drawing); libtest's harness doesn't.
[[test]]
name = "symbols"
harness = false
