[package]
name = "app"
version = "0.1.0"
description = "Blogosphere — a blogging client for blog.fsck.com"
authors = ["Jesse Vincent"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Enforced via `cargo check` / `cargo build` (plain rustc warnings) and via
# `cargo clippy -- -D warnings` (promotes the clippy::pedantic group, which
# defaults to "warn", to a hard failure). A tiny, documented per-lint
# allow-list lives as crate-level attributes in src/lib.rs.
[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = "warn"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-http = "2.5.9"
tauri-plugin-fs = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
keyring = { version = "3.6.3", features = ["apple-native"] }
