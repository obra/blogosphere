# ABOUTME: App-level ACL permissions for the native-UI helper commands
# ABOUTME: (src/platform.rs, src/symbols.rs, src/glass.rs), granted to the main window via capabilities/default.json.

[[permission]]
identifier = "allow-current-platform"
description = "Enables the current_platform command, which reports the OS this build targets."
commands.allow = ["current_platform"]

[[permission]]
identifier = "allow-render-symbol"
description = "Enables the render_symbol command, which draws an SF Symbol to PNG."
commands.allow = ["render_symbol"]

[[permission]]
identifier = "allow-glass-active"
description = "Enables the glass_active command, which reports whether the glass sidebar is on."
commands.allow = ["glass_active"]

[[permission]]
identifier = "allow-open-settings"
description = "Enables the open_settings command, which opens (or focuses) the macOS Settings window."
commands.allow = ["open_settings"]

[[set]]
identifier = "native-ui"
description = "Allows the native-UI helper commands (platform detection, SF Symbol rendering, glass state, opening Settings)."
permissions = ["allow-current-platform", "allow-render-symbol", "allow-glass-active", "allow-open-settings"]
